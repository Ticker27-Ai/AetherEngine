name: autofmt (temporary)

# TEMPORARY helper — delete once the formatted tree has landed.
#
# `cargo fmt --check` gates CI, but the machine that authored this branch has
# no network access to the Rust distribution server, so rustfmt cannot run
# locally. This workflow runs the same rustfmt on the runner and commits the
# result back, which keeps the formatting byte-exact with the version CI uses.

on:
  pull_request:

permissions:
  contents: write

jobs:
  autofmt:
    name: cargo fmt --all
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format core/vfs
        working-directory: core/vfs
        run: cargo fmt --all

      - name: Commit the formatted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/vfs
          if git diff --cached --quiet; then
            echo "core/vfs is already formatted"
          else
            git commit -m "style: cargo fmt --all (core/vfs)"
            # actions/checkout leaves a detached HEAD on pull_request runs.
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          fi
