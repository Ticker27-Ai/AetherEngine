# ---------------------------------------------------------------------------
# AetherEngine build configuration
#
# The container is memory-hungry by nature: every virtualised app brings its
# own dex, resources, native libs and shadow tree into ONE process. Give the
# daemon room or you will spend your life debugging GC pauses that look like
# "random" guest crashes.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AetherEngine reads/writes the guest's shadow tree through JNI; the
# "preserve" behaviour for native libs is required and is expressed per-module
# via packaging.jniLibs.useLegacyPackaging = true. The old
# android.bundle.enableUncompressedNativeLibs flag was removed in AGP 8.1 and
# is a hard error on AGP 8.7, so it must not come back.
#
# BuildConfig generation is enabled per-module where it is used (:core:host).
# The global android.defaults.buildfeatures.buildconfig flag is deprecated and
# removed in AGP 9.0, so it must not come back either.
android.nonFinalResIds=false

# Release metadata (overridden by CI)
VERSION_NAME=0.1.0-dev
VERSION_CODE=1
