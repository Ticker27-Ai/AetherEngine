# ---------------------------------------------------------------------------
# AetherEngine build configuration
#
# The container is memory-hungry by nature: every virtualised app brings its
# own dex, resources, native libs and shadow tree into ONE process. Give the
# daemon room or you will spend your life debugging GC pauses that look like
# "random" guest crashes.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AetherEngine reads/writes the guest's shadow tree through JNI; the default
# "preserve" behaviour for native libs is required.
android.bundle.enableUncompressedNativeLibs=false
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# Release metadata (overridden by CI)
VERSION_NAME=0.1.0-dev
VERSION_CODE=1
